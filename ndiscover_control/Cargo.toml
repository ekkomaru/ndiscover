[package]
name = "ndiscover_control"
version = "0.1.0"
description = "Control NETIO devices with firmware 5.0 or newer over their WebSocket API"
edition = "2024"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
native-tls = "0.2.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
